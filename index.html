<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>날씨</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d0d2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="날씨" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", "Malgun Gothic", sans-serif;
    color: #fff;
    background: #0a0a2e;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    background-attachment: fixed;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: background 1.2s ease;
  }
  body.night {
    background:
      radial-gradient(ellipse at top, #2d1b5a 0%, transparent 60%),
      radial-gradient(ellipse at bottom, #1a1040 0%, transparent 70%),
      linear-gradient(180deg, #0d0d3e 0%, #1a0d3e 50%, #050518 100%);
  }
  body.day {
    background:
      radial-gradient(circle at 78% 14%, rgba(255,240,140,0.85) 0%, rgba(255,210,110,0.5) 8%, rgba(255,200,100,0.15) 20%, transparent 38%),
      linear-gradient(180deg, #2b7fc4 0%, #4ea3dc 35%, #84c5ee 70%, #b8def5 100%);
  }
  body.day .card {
    background: rgba(20, 50, 90, 0.28);
    border: 1px solid rgba(255,255,255,0.18);
  }
  body.day .tabbar { background: rgba(20, 60, 110, 0.7); }
  #stars {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 0;
    transition: opacity 1.2s ease;
  }
  body.day #stars { opacity: 0; }
  body.night #stars { opacity: 1; }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .app {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto;
    padding: 20px 20px 100px;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 4px 16px; font-size: 13px; opacity: 0.85;
  }
  .top-bar .actions { display: flex; gap: 12px; }
  .top-bar button {
    background: none; border: none; color: #fff; cursor: pointer;
    font-size: 18px; padding: 4px;
  }
  .search-wrap { margin-bottom: 16px; display: none; }
  .search-wrap.open { display: flex; gap: 8px; }
  .search-wrap input {
    flex: 1; padding: 12px 16px; border: none; border-radius: 12px;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 15px; outline: none;
  }
  .search-wrap input::placeholder { color: rgba(255,255,255,0.5); }
  .search-wrap button {
    padding: 12px 16px; border: none; border-radius: 12px;
    background: rgba(255,255,255,0.2); color: #fff; cursor: pointer;
  }
  .hero { text-align: center; padding: 8px 0 24px; }
  .hero .city {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 32px; font-weight: 400; letter-spacing: -0.5px;
  }
  .hero .city .pin { font-size: 16px; opacity: 0.7; }
  .hero .temp {
    font-size: 96px; font-weight: 200; line-height: 1.1;
    letter-spacing: -4px; margin: 4px 0;
  }
  .hero .temp sup { font-size: 0.5em; vertical-align: super; font-weight: 300; }
  .hero .desc { font-size: 20px; font-weight: 400; opacity: 0.95; }
  .hero .hilo { font-size: 18px; opacity: 0.85; margin-top: 4px; font-weight: 400; }

  .card {
    background: rgba(60, 60, 110, 0.4);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 18px; padding: 14px 16px; margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .card-title {
    font-size: 12px; opacity: 0.7; text-transform: uppercase;
    letter-spacing: 0.5px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 10px; display: flex; align-items: center; gap: 4px;
  }
  .summary { font-size: 15px; line-height: 1.5; padding: 4px 0; }
  .summary-row { display: flex; align-items: flex-start; gap: 10px; }
  .summary-row .summary { flex: 1; }
  .speak-btn {
    flex: 0 0 auto; background: rgba(255,255,255,0.15); border: none;
    color: #fff; font-size: 20px; padding: 8px 12px; border-radius: 12px;
    cursor: pointer; transition: background 0.15s;
  }
  .speak-btn:hover, .speak-btn:active { background: rgba(255,255,255,0.3); }
  .speak-btn.playing { background: rgba(100,200,255,0.4); }

  .hourly { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
  .hourly::-webkit-scrollbar { display: none; }
  .hour {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 6px 10px; min-width: 56px;
  }
  .hour .h-time { font-size: 14px; font-weight: 500; }
  .hour .h-icon { font-size: 24px; }
  .hour .h-temp { font-size: 18px; font-weight: 500; }
  .hour .h-rain { font-size: 11px; color: #6db3ff; min-height: 14px; }
  .hour.now { background: rgba(255,255,255,0.15); border-radius: 14px; }

  .daily { padding: 4px 0; }
  .drow {
    display: grid;
    grid-template-columns: 50px 30px 40px 1fr 40px;
    align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .drow:last-child { border-bottom: none; }
  .drow .d-day { font-size: 17px; font-weight: 400; }
  .drow .d-rain { font-size: 11px; color: #6db3ff; text-align: center; min-height: 14px; }
  .drow .d-icon { font-size: 24px; text-align: center; }
  .drow .d-low { font-size: 15px; opacity: 0.7; text-align: right; }
  .drow .d-high { font-size: 15px; text-align: right; }
  .bar-wrap {
    height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px;
    position: relative; overflow: hidden;
  }
  .bar {
    position: absolute; top: 0; bottom: 0;
    background: linear-gradient(90deg, #5ac8fa 0%, #34c759 30%, #ffcc00 60%, #ff9500 80%, #ff3b30 100%);
    border-radius: 3px;
  }
  .now-dot {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 8px; height: 8px; border-radius: 50%; background: #fff;
    border: 2px solid rgba(0,0,0,0.3);
  }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: rgba(20, 20, 50, 0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 10px env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 8px) env(safe-area-inset-left);
    display: flex; justify-content: space-around;
  }
  .tabbar button {
    background: none; border: none; color: rgba(255,255,255,0.6);
    font-size: 22px; padding: 8px 16px; cursor: pointer;
  }
  .tabbar button.active { color: #fff; }

  .rain-banner {
    background: linear-gradient(135deg, rgba(70,130,255,0.35), rgba(100,160,255,0.2));
    border: 1px solid rgba(150,200,255,0.25);
    border-radius: 16px; padding: 14px 18px;
    text-align: center; margin-bottom: 16px;
    font-size: 16px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .rain-banner .rb-label { opacity: 0.85; font-size: 14px; font-weight: 400; }
  .rain-banner .rb-value { font-size: 22px; font-weight: 600; }
  .loading, .error { text-align: center; padding: 40px 20px; opacity: 0.7; }
  .error { color: #ffb3b3; }

  .event {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 14px;
  }
  .event:last-child { border-bottom: none; }
  .event .e-time { opacity: 0.7; font-size: 12px; white-space: nowrap; }
  .cal-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: rgba(255,255,255,0.15); color: #fff; cursor: pointer;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="stars"></div>

<div class="app">
  <div class="top-bar">
    <div>날씨</div>
    <div class="actions">
      <button onclick="toggleSearch()" title="검색">🔍</button>
      <button onclick="useGPS()" title="현재 위치">📍</button>
    </div>
  </div>

  <div id="searchWrap" class="search-wrap">
    <input id="q" type="text" placeholder="도시 이름 (예: 서울, Tokyo)" />
    <button onclick="search()">검색</button>
  </div>

  <div id="rain-banner"></div>

  <div id="content"><div class="loading">위치를 가져오는 중...</div></div>
</div>

<div class="tabbar">
  <button class="active" title="날씨">☁️</button>
  <button onclick="useGPS()" title="현재 위치">📍</button>
  <button onclick="toggleSearch()" title="검색">🔍</button>
</div>

<script>
const GOOGLE_CLIENT_ID = '769157442763-n0k5qlp3m9rb6phdc9uq9kn93ii630ko.apps.googleusercontent.com';

const WMO = {
  0:['☀️','맑음','청명함'], 1:['🌤️','대체로 맑음','대체로 맑음'],
  2:['⛅','부분적 흐림','부분적 흐림'], 3:['☁️','흐림','흐림'],
  45:['🌫️','안개','안개'], 48:['🌫️','짙은 안개','짙은 안개'],
  51:['🌦️','약한 이슬비','이슬비'], 53:['🌦️','이슬비','이슬비'], 55:['🌧️','강한 이슬비','강한 이슬비'],
  61:['🌦️','약한 비','약한 비'], 63:['🌧️','비','비'], 65:['🌧️','강한 비','강한 비'],
  71:['🌨️','약한 눈','약한 눈'], 73:['🌨️','눈','눈'], 75:['❄️','강한 눈','강한 눈'], 77:['🌨️','싸락눈','싸락눈'],
  80:['🌦️','소나기','소나기'], 81:['🌧️','강한 소나기','강한 소나기'], 82:['⛈️','폭우','폭우'],
  85:['🌨️','약한 눈 소나기','약한 눈 소나기'], 86:['❄️','강한 눈 소나기','강한 눈 소나기'],
  95:['⛈️','뇌우','뇌우 가능성'], 96:['⛈️','뇌우+우박','우박 동반 뇌우'], 99:['⛈️','강한 뇌우','강한 우박 뇌우']
};
const wmo = c => WMO[c] || ['❓','알 수 없음','알 수 없음'];

// 시간대별 테마 (0~9시: 밤, 그 외: 낮)
function updateTheme() {
  const h = new Date().getHours();
  const isNight = h >= 0 && h < 9;
  document.body.classList.toggle('night', isNight);
  document.body.classList.toggle('day', !isNight);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', isNight ? '#0d0d2e' : '#4ea3dc');
}
updateTheme();
setInterval(updateTheme, 60000);

// 별 생성
function makeStars() {
  const sky = document.getElementById('stars');
  const count = 120;
  let html = '';
  for (let i = 0; i < count; i++) {
    const x = Math.random() * 100;
    const y = Math.random() * 60;
    const size = Math.random() * 2 + 0.5;
    const delay = Math.random() * 3;
    const opacity = Math.random() * 0.7 + 0.3;
    html += `<div class="star" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px;animation-delay:${delay}s;opacity:${opacity}"></div>`;
  }
  sky.innerHTML = html;
}
makeStars();

function toggleSearch() {
  document.getElementById('searchWrap').classList.toggle('open');
  if (document.getElementById('searchWrap').classList.contains('open')) {
    document.getElementById('q').focus();
  }
}

async function load(city) {
  document.getElementById('content').innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ko`).then(x => x.json());
    if (!geo.results || !geo.results.length) {
      document.getElementById('content').innerHTML = '<div class="error">도시를 찾을 수 없습니다</div>'; return;
    }
    const g = geo.results[0];
    await loadByCoords(g.latitude, g.longitude, g.name);
  } catch {
    document.getElementById('content').innerHTML = '<div class="error">날씨를 가져올 수 없습니다</div>';
  }
}

async function loadByCoords(lat, lon, placeName) {
  document.getElementById('content').innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation,is_day&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=10`).then(x => x.json());

    let name = placeName;
    if (!name) {
      try {
        const rev = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=ko`).then(x => x.json());
        name = rev.results && rev.results[0] ? rev.results[0].name : '현재 위치';
      } catch { name = '현재 위치'; }
    }
    render(name, w);
  } catch {
    document.getElementById('content').innerHTML = '<div class="error">날씨를 가져올 수 없습니다</div>';
  }
}

function render(place, w) {
  const c = w.current, h = w.hourly, d = w.daily;
  const [icon, desc, longDesc] = wmo(c.weather_code);
  const todayHi = Math.round(d.temperature_2m_max[0]);
  const todayLo = Math.round(d.temperature_2m_min[0]);
  const sunsetTime = new Date(d.sunset[0]);
  const sunsetStr = `${sunsetTime.getHours()}시 ${String(sunsetTime.getMinutes()).padStart(2,'0')}분`;

  const rainProb = d.precipitation_probability_max[0] || 0;
  summaryContext = { todayLo, todayHi, rainProb };
  const { display: summary, speech: summarySpeech } = buildSummary(todayLo, todayHi, rainProb, todayEventsCache);
  currentSummary = summarySpeech;

  // 시간별 예보 (현재부터 24시간)
  const nowIdx = h.time.findIndex(t => new Date(t) > new Date()) - 1;
  const startIdx = Math.max(0, nowIdx);
  let hourlyHtml = '';
  for (let i = startIdx; i < startIdx + 24 && i < h.time.length; i++) {
    const t = new Date(h.time[i]);
    const isNow = (i === startIdx);
    const label = isNow ? '지금' : `${t.getHours()}시`;
    const [hi] = wmo(h.weather_code[i]);
    const rain = h.precipitation_probability[i];
    hourlyHtml += `<div class="hour ${isNow ? 'now' : ''}">
      <div class="h-time">${label}</div>
      <div class="h-icon">${hi}</div>
      <div class="h-temp">${Math.round(h.temperature_2m[i])}°</div>
      <div class="h-rain">${rain >= 30 ? rain + '%' : ''}</div>
    </div>`;
  }

  // 10일 예보 - 전체 범위 계산
  let globalMin = Infinity, globalMax = -Infinity;
  for (let i = 0; i < d.time.length; i++) {
    globalMin = Math.min(globalMin, d.temperature_2m_min[i]);
    globalMax = Math.max(globalMax, d.temperature_2m_max[i]);
  }
  const range = globalMax - globalMin || 1;
  const days = ['일','월','화','수','목','금','토'];
  let dailyHtml = '';
  for (let i = 0; i < d.time.length; i++) {
    const dt = new Date(d.time[i]);
    const label = i === 0 ? '오늘' : days[dt.getDay()];
    const [di] = wmo(d.weather_code[i]);
    const lo = d.temperature_2m_min[i], hi = d.temperature_2m_max[i];
    const left = ((lo - globalMin) / range) * 100;
    const width = ((hi - lo) / range) * 100;
    const rainProb = d.precipitation_probability_max[i] || 0;
    let nowDot = '';
    if (i === 0) {
      const cur = c.temperature_2m;
      const pos = ((cur - lo) / (hi - lo || 1)) * 100;
      nowDot = `<div class="now-dot" style="left:${Math.max(0, Math.min(100, pos))}%"></div>`;
    }
    dailyHtml += `<div class="drow">
      <div class="d-day">${label}</div>
      <div class="d-rain">${rainProb >= 30 ? '💧'+rainProb+'%' : ''}</div>
      <div class="d-icon">${di}</div>
      <div>
        <div class="d-low" style="display:inline-block;width:30px;text-align:right;margin-right:8px">${Math.round(lo)}°</div>
        <div class="bar-wrap" style="display:inline-block;width:calc(100% - 80px);vertical-align:middle">
          <div class="bar" style="left:${left}%;width:${width}%;position:relative;height:100%">${nowDot}</div>
        </div>
        <div class="d-high" style="display:inline-block;width:30px;text-align:right;margin-left:8px">${Math.round(hi)}°</div>
      </div>
      <div></div>
    </div>`;
  }

  const rainProbToday = d.precipitation_probability_max[0] || 0;
  const rainSumToday = d.precipitation_sum[0] || 0;
  document.getElementById('rain-banner').innerHTML = `
    <div class="rain-banner">
      💧 <span class="rb-label">오늘 강수확률</span>
      <span class="rb-value">${rainProbToday}%</span>
      ${rainSumToday > 0 ? `<span class="rb-label">· ${rainSumToday}mm</span>` : ''}
    </div>
  `;

  document.getElementById('content').innerHTML = `
    <div class="hero">
      <div class="city"><span class="pin">📍</span>${place}</div>
      <div class="temp">${Math.round(c.temperature_2m)}<sup>°</sup></div>
      <div class="desc">${desc}</div>
      <div class="hilo">최고:${todayHi}°  최저:${todayLo}°</div>
    </div>

    <div class="card">
      <div class="summary-row">
        <div class="summary" id="summary-text">${summary}</div>
        <button class="speak-btn" id="speak-btn" onclick="speakSummary()" title="음성으로 듣기">🔊</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">⏱ 시간별 일기예보</div>
      <div class="hourly">${hourlyHtml}</div>
    </div>

    <div class="card">
      <div class="card-title">📅 10일간의 일기예보</div>
      <div class="daily">${dailyHtml}</div>
    </div>

    <div class="card">
      <div class="card-title">📆 구글 캘린더</div>
      <div id="cal-result">
        <button class="cal-btn" onclick="googleAuth()">구글 캘린더 연결</button>
      </div>
    </div>
  `;
}

function search() {
  const v = document.getElementById('q').value.trim();
  if (v) { load(v); toggleSearch(); }
}
document.getElementById('q').addEventListener('keypress', e => {
  if (e.key === 'Enter') search();
});

function useGPS() {
  if (!navigator.geolocation) { alert('GPS 미지원'); return; }
  document.getElementById('content').innerHTML = '<div class="loading">현재 위치 가져오는 중...</div>';
  navigator.geolocation.getCurrentPosition(
    pos => loadByCoords(pos.coords.latitude, pos.coords.longitude, null),
    err => {
      document.getElementById('content').innerHTML =
        `<div class="error">위치를 가져오지 못했습니다<br><small>${err.message}</small></div>`;
    },
    { timeout: 10000 }
  );
}

// ===== 요약 멘트 빌더 (날씨 + 일정) =====
let summaryContext = null;
let todayEventsCache = [];

function buildSummary(todayLo, todayHi, rainProb, events) {
  let wPart, wSpeech, closing, closingSpeech;
  if (rainProb === 0) {
    wPart = `화창한 날씨네요 ☀️ 최저 기온은 ${todayLo}도이고 최고 기온은 ${todayHi}도입니다.`;
    wSpeech = `화창한 날씨네요. 최저 기온은 ${todayLo}도이고, 최고 기온은 ${todayHi}도입니다.`;
    closing = '좋은 하루 되세요~';
    closingSpeech = '좋은 하루 되세요.';
  } else if (rainProb < 50) {
    wPart = `비가 올 수도 있어요 🌦️ 최저 기온은 ${todayLo}도이고 최고 기온은 ${todayHi}도입니다. 강수확률은 ${rainProb}%예요.`;
    wSpeech = `비가 올 수도 있어요. 최저 기온은 ${todayLo}도이고, 최고 기온은 ${todayHi}도입니다. 강수 확률은 ${rainProb} 퍼센트예요.`;
    closing = '멋진 하루 되세요~';
    closingSpeech = '멋진 하루 되세요.';
  } else {
    wPart = `오늘 비가 와요 ☔ 우산을 꼭 챙기세요! 강수확률 ${rainProb}%, 최저 ${todayLo}도 · 최고 ${todayHi}도입니다.`;
    wSpeech = `오늘 비가 와요. 우산을 꼭 챙기세요! 강수 확률은 ${rainProb} 퍼센트, 최저 기온은 ${todayLo}도, 최고 기온은 ${todayHi}도입니다.`;
    closing = '행복한 하루 되세요!';
    closingSpeech = '행복한 하루 되세요!';
  }

  let ePart = '', eSpeech = '';
  if (events && events.length) {
    const allDay = events.filter(e => !e.start.dateTime);
    const timed = events.filter(e => e.start.dateTime);
    const segs = [], segsSpeech = [];
    if (timed.length) {
      const list = timed.map(e => {
        const dt = new Date(e.start.dateTime);
        const h = dt.getHours(), m = dt.getMinutes();
        const tstr = m === 0 ? `${h}시` : `${h}시 ${String(m).padStart(2,'0')}분`;
        return { tstr, name: e.summary || '(제목 없음)' };
      });
      if (list.length === 1) {
        segs.push(`${list[0].tstr}에 '${list[0].name}' 일정`);
        segsSpeech.push(`${list[0].tstr}에 ${list[0].name} 일정`);
      } else {
        const joined = list.map(x => `${x.tstr} ${x.name}`).join(', ');
        segs.push(joined + ' 일정');
        segsSpeech.push(joined + ' 일정');
      }
    }
    if (allDay.length) {
      const names = allDay.map(e => e.summary || '(제목 없음)').join(', ');
      segs.push(`종일 '${names}'`);
      segsSpeech.push(`종일 ${names}`);
    }
    ePart = ` 그리고 오늘 ${segs.join(', ')}이 있네요. 잘 다녀오세요! 🙌`;
    eSpeech = ` 그리고 오늘 ${segsSpeech.join(', ')}이 있네요. 잘 다녀오세요.`;
  }

  return { display: wPart + ePart + ' ' + closing, speech: wSpeech + eSpeech + ' ' + closingSpeech };
}

function rebuildSummary() {
  if (!summaryContext) return;
  const { todayLo, todayHi, rainProb } = summaryContext;
  const { display, speech } = buildSummary(todayLo, todayHi, rainProb, todayEventsCache);
  currentSummary = speech;
  const el = document.getElementById('summary-text');
  if (el) el.textContent = display;
}

// ===== 음성 재생 (TTS) =====
let currentSummary = '';
let koreanVoice = null;

function pickKoreanVoice() {
  const voices = speechSynthesis.getVoices();
  koreanVoice = voices.find(v => v.lang === 'ko-KR') || voices.find(v => v.lang.startsWith('ko')) || null;
}
if ('speechSynthesis' in window) {
  pickKoreanVoice();
  speechSynthesis.onvoiceschanged = pickKoreanVoice;
}

function speak(text) {
  if (!('speechSynthesis' in window)) { alert('이 브라우저는 음성을 지원하지 않습니다'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  if (koreanVoice) u.voice = koreanVoice;
  u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
  const btn = document.getElementById('speak-btn');
  if (btn) btn.classList.add('playing');
  u.onend = () => { if (btn) btn.classList.remove('playing'); };
  u.onerror = () => { if (btn) btn.classList.remove('playing'); };
  speechSynthesis.speak(u);
}

function speakSummary() {
  if (currentSummary) speak(currentSummary);
}

let googleToken = null;
function googleAuth() {
  if (GOOGLE_CLIENT_ID.startsWith('YOUR_CLIENT_ID')) {
    document.getElementById('cal-result').innerHTML = '<div class="error">먼저 GOOGLE_CLIENT_ID 설정 필요</div>'; return;
  }
  if (!window.google || !google.accounts) {
    document.getElementById('cal-result').innerHTML = '<div class="error">Google 라이브러리 로드 실패</div>'; return;
  }
  const tc = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/calendar.readonly',
    callback: r => { if (r.access_token) { googleToken = r.access_token; loadEvents(); } }
  });
  tc.requestAccessToken();
}

async function loadEvents() {
  const el = document.getElementById('cal-result');
  el.innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7).toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(start)}&timeMax=${encodeURIComponent(end)}&singleEvents=true&orderBy=startTime&maxResults=20`;
    const data = await fetch(url, { headers: { Authorization: `Bearer ${googleToken}` } }).then(x => x.json());

    // 오늘 일정만 골라서 요약 멘트에 반영
    const today = new Date();
    const yyyy = today.getFullYear(), mm = today.getMonth(), dd = today.getDate();
    const todayStr = `${yyyy}-${String(mm+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    todayEventsCache = (data.items || []).filter(ev => {
      if (ev.start.dateTime) {
        const t = new Date(ev.start.dateTime);
        return t.getFullYear() === yyyy && t.getMonth() === mm && t.getDate() === dd;
      }
      return ev.start.date === todayStr;
    });
    rebuildSummary();

    if (!data.items || !data.items.length) { el.innerHTML = '<div style="padding:10px;opacity:0.7;font-size:13px">앞으로 7일간 일정 없음</div>'; return; }
    let html = '';
    for (const ev of data.items) {
      const s = ev.start.dateTime || ev.start.date;
      const dt = new Date(s);
      const timeStr = ev.start.dateTime
        ? `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`
        : `${dt.getMonth()+1}/${dt.getDate()} 종일`;
      html += `<div class="event"><span>${ev.summary || '(제목 없음)'}</span><span class="e-time">${timeStr}</span></div>`;
    }
    el.innerHTML = html;
  } catch { el.innerHTML = '<div class="error">일정 가져오기 실패</div>'; }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

window.addEventListener('load', () => {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => loadByCoords(pos.coords.latitude, pos.coords.longitude, null),
      () => load('서울'),
      { timeout: 5000 }
    );
  } else { load('서울'); }
});
</script>
