<!DOCTYPE html>
<html lang="ko">
<head>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", "Malgun Gothic", sans-serif;
    color: #fff;
    background: #0a0a2e;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    background-attachment: fixed;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: background 1.2s ease;
  }
  body.night {
    background:
      radial-gradient(ellipse at top, #2d1b5a 0%, transparent 60%),
      radial-gradient(ellipse at bottom, #1a1040 0%, transparent 70%),
      linear-gradient(180deg, #0d0d3e 0%, #1a0d3e 50%, #050518 100%);
  }
  body.day {
    background:
      radial-gradient(circle at 78% 14%, rgba(255,240,140,0.85) 0%, rgba(255,210,110,0.5) 8%, rgba(255,200,100,0.15) 20%, transparent 38%),
      linear-gradient(180deg, #2b7fc4 0%, #4ea3dc 35%, #84c5ee 70%, #b8def5 100%);
  }
  body.day .card {
    background: rgba(20, 50, 90, 0.28);
    border: 1px solid rgba(255,255,255,0.18);
  }
  body.day .tabbar { background: rgba(20, 60, 110, 0.7); }

  /* 흐린 날 배경 */
  body.cloudy {
    background:
      radial-gradient(ellipse at top, #6c798b 0%, transparent 65%),
      linear-gradient(180deg, #4f5b6b 0%, #62707f 50%, #7c8b9c 100%);
  }
  body.cloudy.night {
    background:
      radial-gradient(ellipse at top, #1a222e 0%, transparent 70%),
      linear-gradient(180deg, #11171f 0%, #1d2530 50%, #07090d 100%);
  }
  body.cloudy .card {
    background: rgba(35, 48, 65, 0.45);
    border: 1px solid rgba(255,255,255,0.15);
  }
  body.cloudy.night .card { background: rgba(30, 40, 55, 0.55); }
  body.cloudy .tabbar { background: rgba(30, 42, 58, 0.85); }

  /* 떠다니는 구름 */
  body.cloudy #clouds { opacity: 1; }
  body.thunder #clouds { opacity: 1; }
  .cloud {
    position: absolute;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 50%, transparent 75%);
    border-radius: 50%;
    filter: blur(8px);
    animation: drift linear infinite;
  }
  body.night .cloud {
    background: radial-gradient(ellipse at center, rgba(200,210,225,0.18) 0%, rgba(180,190,210,0.08) 50%, transparent 75%);
  }
  @keyframes drift {
    from { transform: translateX(-300px); }
    to { transform: translateX(110vw); }
  }

  /* 번개 (천둥) */
  body.thunder {
    background:
      radial-gradient(ellipse at top, #2a2a3a 0%, transparent 60%),
      linear-gradient(180deg, #1a1a28 0%, #232333 50%, #0a0a14 100%);
  }
  body.thunder.night {
    background:
      radial-gradient(ellipse at top, #15151f 0%, transparent 60%),
      linear-gradient(180deg, #0a0a14 0%, #14141e 50%, #050508 100%);
  }
  body.thunder .card { background: rgba(30, 30, 50, 0.55); }
  body.thunder .tabbar { background: rgba(20, 20, 35, 0.9); }
  #lightning {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 5;
    background: #fff;
    opacity: 0;
    mix-blend-mode: screen;
  }
  body.thunder #lightning { animation: lightning 9s infinite; }
  @keyframes lightning {
    0%, 100% { opacity: 0; }
    25% { opacity: 0; }
    25.3% { opacity: 0.85; }
    25.7% { opacity: 0.1; }
    26% { opacity: 0.65; }
    26.4% { opacity: 0; }
    62% { opacity: 0; }
    62.3% { opacity: 0.7; }
    62.6% { opacity: 0; }
  }

  /* 비 오는 날 배경 */
  body.rainy {
    background:
      radial-gradient(ellipse at top, #3a4a5e 0%, transparent 60%),
      linear-gradient(180deg, #2c3e50 0%, #34495e 40%, #4a5f78 100%);
  }
  body.rainy.night {
    background:
      radial-gradient(ellipse at top, #1a2535 0%, transparent 60%),
      linear-gradient(180deg, #0f1a2a 0%, #1a2a3e 50%, #08111c 100%);
  }
  body.rainy .card { background: rgba(40, 55, 75, 0.45); }
  body.rainy .tabbar { background: rgba(20, 35, 55, 0.85); }

  /* 눈 오는 날 배경 */
  body.snowy {
    background:
      radial-gradient(ellipse at top, #d8e3ec 0%, transparent 60%),
      linear-gradient(180deg, #8aa4bd 0%, #a8bccf 50%, #c8d8e6 100%);
  }
  body.snowy.night {
    background:
      radial-gradient(ellipse at top, #3a4658 0%, transparent 60%),
      linear-gradient(180deg, #2a3548 0%, #3a4a60 50%, #1c2536 100%);
  }
  body.snowy .card {
    background: rgba(30, 50, 80, 0.35);
    border: 1px solid rgba(255,255,255,0.2);
  }
  body.snowy.night .card { background: rgba(40, 55, 80, 0.45); }
  body.snowy .tabbar { background: rgba(50, 70, 100, 0.75); }

  #stars, #rain, #snow, #clouds {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 0;
    transition: opacity 1.2s ease;
  }
  #rain, #snow { opacity: 0; }
  body.night #stars { opacity: 1; }
  body.day #stars { opacity: 0; }
  body.rainy #stars { opacity: 0; }
  body.snowy #stars { opacity: 0; }
  body.rainy #rain { opacity: 1; }
  body.snowy #snow { opacity: 1; }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .raindrop {
    position: absolute; width: 1.5px;
    background: linear-gradient(to bottom, transparent, rgba(180,210,240,0.8));
    animation: rainfall linear infinite;
  }
  @keyframes rainfall {
    0% { transform: translateY(-100px); }
    100% { transform: translateY(110vh); }
  }
  .snowflake {
    position: absolute; color: #fff; user-select: none;
    animation: snowfall linear infinite;
    text-shadow: 0 0 4px rgba(255,255,255,0.5);
  }
  @keyframes snowfall {
    0% { transform: translateY(-50px) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(110vh) translateX(40px); opacity: 0; }
  }
  .app {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto;
    padding: 20px 20px 100px;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 4px 16px; font-size: 13px; opacity: 0.85;
  }
  .top-bar .actions { display: flex; gap: 12px; }
  .top-bar button {
    background: none; border: none; color: #fff; cursor: pointer;
    font-size: 18px; padding: 4px;
  }
  .search-wrap { margin-bottom: 16px; display: none; }
  .search-wrap.open { display: flex; gap: 8px; }
  .search-wrap input {
    flex: 1; padding: 12px 16px; border: none; border-radius: 12px;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 15px; outline: none;
  }
  .search-wrap input::placeholder { color: rgba(255,255,255,0.5); }
  .search-wrap button {
    padding: 12px 16px; border: none; border-radius: 12px;
    background: rgba(255,255,255,0.2); color: #fff; cursor: pointer;
  }
  .hero { text-align: center; padding: 8px 0 16px; }
  .hero-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 4px 12px;
  }
  .hero-head .loc {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 22px; font-weight: 500;
  }
  .hero-head .loc .pin { font-size: 14px; opacity: 0.7; }
  .hero-head .now-label {
    font-size: 13px; opacity: 0.7; padding: 4px 12px;
    background: rgba(255,255,255,0.12); border-radius: 20px;
  }
  .hero-main {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 16px; padding: 8px 8px 4px;
  }
  .hero-main .h-icon { font-size: 72px; line-height: 1; }
  .hero-main .h-temp {
    font-size: 80px; font-weight: 200; line-height: 1;
    letter-spacing: -3px; text-align: left;
  }
  .hero-main .h-temp sup { font-size: 0.4em; vertical-align: super; font-weight: 300; }
  .hero-main .h-prob {
    text-align: right; line-height: 1.2;
  }
  .hero-main .h-prob .label { font-size: 12px; opacity: 0.75; }
  .hero-main .h-prob .val {
    font-size: 26px; font-weight: 600; color: #ffd866;
  }
  .hero .desc {
    text-align: center; font-size: 16px; opacity: 0.9;
    margin-top: 4px;
  }

  /* 일정 리스트 */
  .events-card .card-title { justify-content: space-between; }
  .events-card .count {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    background: rgba(255,255,255,0.18); text-transform: none; letter-spacing: 0;
    opacity: 0.95; font-weight: 600;
  }
  .ev-item {
    display: grid; grid-template-columns: 60px 1fr auto;
    align-items: center; gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .ev-item:last-child { border-bottom: none; }
  .ev-item.upcoming { background: rgba(255,180,100,0.08); border-radius: 8px; padding-left: 8px; padding-right: 8px; }
  .ev-time {
    font-size: 16px; font-weight: 600; letter-spacing: -0.3px;
  }
  .ev-info .name { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
  .ev-info .sub { font-size: 12px; opacity: 0.75; display: flex; align-items: center; gap: 4px; }
  .ev-info .sub .dot { opacity: 0.5; }
  .ev-prob {
    font-size: 15px; font-weight: 600;
    text-align: right; min-width: 50px;
  }
  .ev-prob.rainy { color: #ffd866; }
  .ev-prob.cloudy { color: #a8c5e0; }
  .ev-prob.clear { color: #6dd57b; }
  .ev-prob.snowy { color: #cfe7ff; }
  .ev-prob.thunder { color: #ff8e8e; }
  .events-empty {
    text-align: center; padding: 24px 12px; opacity: 0.7; font-size: 13px;
  }
  .cal-mini-btn {
    background: rgba(255,255,255,0.18); border: none; color: #fff;
    padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer;
    text-transform: none; letter-spacing: 0; opacity: 1;
  }

  .card {
    background: rgba(60, 60, 110, 0.4);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 18px; padding: 14px 16px; margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .card-title {
    font-size: 12px; opacity: 0.7; text-transform: uppercase;
    letter-spacing: 0.5px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 10px; display: flex; align-items: center; gap: 4px;
  }
  .summary { font-size: 15px; line-height: 1.5; padding: 4px 0; }
  .summary-row { display: flex; align-items: flex-start; gap: 10px; }
  .summary-row .summary { flex: 1; }
  .speak-btn {
    flex: 0 0 auto; background: rgba(255,255,255,0.15); border: none;
    color: #fff; font-size: 20px; padding: 8px 12px; border-radius: 12px;
    cursor: pointer; transition: background 0.15s;
  }
  .speak-btn:hover, .speak-btn:active { background: rgba(255,255,255,0.3); }
  .speak-btn.playing { background: rgba(100,200,255,0.4); }

  .hourly { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
  .hourly::-webkit-scrollbar { display: none; }
  .hour {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 6px 10px; min-width: 56px;
  }
  .hour .h-time { font-size: 14px; font-weight: 500; }
  .hour .h-icon { font-size: 24px; }
  .hour .h-temp { font-size: 18px; font-weight: 500; }
  .hour .h-rain { font-size: 11px; color: #6db3ff; min-height: 14px; }
  .hour.now { background: rgba(255,255,255,0.15); border-radius: 14px; }

  .daily { padding: 4px 0; }
  .drow {
    display: grid;
    grid-template-columns: 50px 30px 40px 1fr 40px;
    align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .drow:last-child { border-bottom: none; }
  .drow .d-day { font-size: 17px; font-weight: 400; }
  .drow .d-rain { font-size: 11px; color: #6db3ff; text-align: center; min-height: 14px; }
  .drow .d-icon { font-size: 24px; text-align: center; }
  .drow .d-low { font-size: 15px; opacity: 0.7; text-align: right; }
  .drow .d-high { font-size: 15px; text-align: right; }
  .bar-wrap {
    height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px;
    position: relative; overflow: hidden;
  }
  .bar {
    position: absolute; top: 0; bottom: 0;
    background: linear-gradient(90deg, #5ac8fa 0%, #34c759 30%, #ffcc00 60%, #ff9500 80%, #ff3b30 100%);
    border-radius: 3px;
  }
  .now-dot {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 8px; height: 8px; border-radius: 50%; background: #fff;
    border: 2px solid rgba(0,0,0,0.3);
  }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: rgba(20, 20, 50, 0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 10px env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 8px) env(safe-area-inset-left);
    display: flex; justify-content: space-around;
  }
  .tabbar button {
    background: none; border: none; color: rgba(255,255,255,0.6);
    font-size: 22px; padding: 8px 16px; cursor: pointer;
  }
  .tabbar button.active { color: #fff; }

  .rain-banner {
    background: linear-gradient(135deg, rgba(70,130,255,0.35), rgba(100,160,255,0.2));
    border: 1px solid rgba(150,200,255,0.25);
    border-radius: 16px; padding: 14px 18px;
    text-align: center; margin-bottom: 16px;
    font-size: 16px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .rain-banner .rb-label { opacity: 0.85; font-size: 14px; font-weight: 400; }
  .rain-banner .rb-value { font-size: 22px; font-weight: 600; }
  .loading, .error { text-align: center; padding: 40px 20px; opacity: 0.7; }
  .error { color: #ffb3b3; }

  .event {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 14px;
  }
  .event:last-child { border-bottom: none; }
  .event .e-time { opacity: 0.7; font-size: 12px; white-space: nowrap; }
  .cal-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: rgba(255,255,255,0.15); color: #fff; cursor: pointer;
    font-size: 14px;

</style>

<body>
<div id="stars"></div>
<div id="rain"></div>
<div id="snow"></div>
<div id="clouds"></div>
<div id="lightning"></div>

<div class="app">
  <div class="top-bar">
    <div>날씨</div>
    <div class="actions">
      <button onclick="toggleSearch()" title="검색">🔍</button>
      <button onclick="useGPS()" title="현재 위치">📍</button>
    </div>
  </div>

  <div id="searchWrap" class="search-wrap">
    <input id="q" type="text" placeholder="도시 이름 (예: 서울, Tokyo)" />
    <button onclick="search()">검색</button>
  </div>

  <div id="rain-banner"></div>

  <div id="content"><div class="loading">위치를 가져오는 중...</div></div>
</div>

<div class="tabbar">
  <button class="active" title="날씨">☁️</button>
  <button onclick="useGPS()" title="현재 위치">📍</button>
  <button onclick="toggleSearch()" title="검색">🔍</button>
</div>

<script>
const GOOGLE_CLIENT_ID = '769157442763-n0k5qlp3m9rb6phdc9uq9kn93ii630ko.apps.googleusercontent.com';

const WMO = {
  0:['☀️','맑음','청명함'], 1:['🌤️','대체로 맑음','대체로 맑음'],
  2:['⛅','부분적 흐림','부분적 흐림'], 3:['☁️','흐림','흐림'],
  45:['🌫️','안개','안개'], 48:['🌫️','짙은 안개','짙은 안개'],
  51:['🌦️','약한 이슬비','이슬비'], 53:['🌦️','이슬비','이슬비'], 55:['🌧️','강한 이슬비','강한 이슬비'],
  61:['🌦️','약한 비','약한 비'], 63:['🌧️','비','비'], 65:['🌧️','강한 비','강한 비'],
  71:['🌨️','약한 눈','약한 눈'], 73:['🌨️','눈','눈'], 75:['❄️','강한 눈','강한 눈'], 77:['🌨️','싸락눈','싸락눈'],
  80:['🌦️','소나기','소나기'], 81:['🌧️','강한 소나기','강한 소나기'], 82:['⛈️','폭우','폭우'],
  85:['🌨️','약한 눈 소나기','약한 눈 소나기'], 86:['❄️','강한 눈 소나기','강한 눈 소나기'],
  95:['⛈️','뇌우','뇌우 가능성'], 96:['⛈️','뇌우+우박','우박 동반 뇌우'], 99:['⛈️','강한 뇌우','강한 우박 뇌우']
};
const wmo = c => WMO[c] || ['❓','알 수 없음','알 수 없음'];

// 시간대별 테마 (낮 07~19시, 밤 19~07시) + 날씨 상태
let currentWeatherCode = null;
let currentRainProb = 0;
const RAIN_CODES = new Set([51,53,55,61,63,65,80,81,82,95,96,99]);
const SNOW_CODES = new Set([71,73,75,77,85,86]);
const THUNDER_CODES = new Set([95,96,99]);

function updateTheme() {
  const h = new Date().getHours();
  const isNight = h >= 19 || h < 7;
  document.body.classList.toggle('night', isNight);
  document.body.classList.toggle('day', !isNight);

  // 천둥/번개 → thunder + rainy (천둥은 보통 비 동반)
  const isThunder = currentWeatherCode != null && THUNDER_CODES.has(currentWeatherCode);
  // 눈은 weather_code 기준, 그 외는 강수확률(현재 시간) 기준으로 분기
  // 0~40% 맑음 / 40~70% 흐림 / 70~100% 비 내림
  const isSnow = !isThunder && currentWeatherCode != null && SNOW_CODES.has(currentWeatherCode);
  let isRain = false, isCloudy = false;
  if (!isSnow && !isThunder) {
    if (currentRainProb >= 70) isRain = true;
    else if (currentRainProb >= 40) isCloudy = true;
  } else if (isThunder) {
    isRain = true; // 천둥치면 비도 같이
  }
  document.body.classList.toggle('rainy', isRain);
  document.body.classList.toggle('snowy', isSnow);
  document.body.classList.toggle('cloudy', isCloudy);
  document.body.classList.toggle('thunder', isThunder);

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    let color = isNight ? '#0d0d2e' : '#4ea3dc';
    if (isThunder) color = isNight ? '#0a0a14' : '#1a1a28';
    else if (isSnow) color = isNight ? '#2a3548' : '#a8bccf';
    else if (isRain) color = isNight ? '#0f1a2a' : '#34495e';
    else if (isCloudy) color = isNight ? '#1d2530' : '#62707f';
    meta.setAttribute('content', color);
  }
}
updateTheme();
setInterval(() => { updateTheme(); rebuildSummary(); renderTodayEvents(); }, 60000);

// 별 생성
function makeStars() {
  const sky = document.getElementById('stars');
  const count = 120;
  let html = '';
  for (let i = 0; i < count; i++) {
    const x = Math.random() * 100;
    const y = Math.random() * 60;
    const size = Math.random() * 2 + 0.5;
    const delay = Math.random() * 3;
    const opacity = Math.random() * 0.7 + 0.3;

async function load(city) {
  document.getElementById('content').innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ko`).then(x => x.json());
    if (!geo.results || !geo.results.length) {
      document.getElementById('content').innerHTML = '<div class="error">도시를 찾을 수 없습니다</div>'; return;
    }
    const g = geo.results[0];
    await loadByCoords(g.latitude, g.longitude, g.name);
  } catch {
    document.getElementById('content').innerHTML = '<div class="error">날씨를 가져올 수 없습니다</div>';
  }
}

async function reverseGeocode(lat, lon) {
  // OpenStreetMap Nominatim - 한국 동/구 단위까지 상세 (무료, 키 X)
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=14&accept-language=ko`;
    const data = await fetch(url).then(x => x.json());
    if (data && data.address) {
      const a = data.address;
      const detail = a.neighbourhood || a.suburb || a.quarter || a.hamlet || a.village || a.town || a.city_district;
      const city = a.city || a.county || a.borough || a.state;
      if (detail && city && detail !== city) return `${detail} ${city}`;
      return detail || city || a.state || (data.display_name || '').split(',')[0].trim();
    }
  } catch (e) {}
  // 폴백: Open-Meteo
  try {
    const rev = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=ko`).then(x => x.json());
    if (rev.results && rev.results[0]) return rev.results[0].name;
  } catch (e) {}
  return null;
}

async function loadByCoords(lat, lon, placeName) {
  document.getElementById('content').innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation,is_day&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=10`).then(x => x.json());

    let name = placeName;
    if (!name) {
      name = await reverseGeocode(lat, lon) || '현재 위치';
    }
    currentForecast = w;
    currentPlaceName = name;
    render(name, w);
  } catch {
    document.getElementById('content').innerHTML = '<div class="error">날씨를 가져올 수 없습니다</div>';
  }
}

// ===== 요약 멘트 빌더 (날씨 + 일정) =====
let summaryContext = null;
let todayEventsCache = [];

function filterEventsToShow(events) {
  if (!events || !events.length) return [];
  const now = Date.now();
  const WINDOW = 30 * 60 * 1000; // 일정 30분 전부터
  return events.filter(ev => {
    if (!ev.start.dateTime) return true; // 종일 일정은 항상 표시
    const start = new Date(ev.start.dateTime).getTime();
    const end = (ev.end && ev.end.dateTime) ? new Date(ev.end.dateTime).getTime() : start + 60 * 60 * 1000;
    return now >= (start - WINDOW) && now <= end;
  });
}

function buildSummary(tempNow, rainProbNow, allEvents) {
  const events = filterEventsToShow(allEvents);
  const hasEvents = events && events.length;
  let wPart = '', wSpeech = '', closing, closingSpeech;

  if (rainProbNow < 40) {
    if (!hasEvents) {
      wPart = `현재 화창한 날씨네요 ☀️ 기온은 ${tempNow}도, 강수확률은 ${rainProbNow}%예요.`;
      wSpeech = `현재 화창한 날씨네요. 기온은 ${tempNow}도, 강수 확률은 ${rainProbNow} 퍼센트예요.`;
    }
    closing = '좋은 하루 되세요~';
    closingSpeech = '좋은 하루 되세요.';
  } else if (rainProbNow < 70) {
    if (!hasEvents) {
      wPart = `지금 흐려요 🌦️ 기온은 ${tempNow}도, 강수확률은 ${rainProbNow}%예요.`;
      wSpeech = `지금 흐려요. 기온은 ${tempNow}도, 강수 확률은 ${rainProbNow} 퍼센트예요.`;
    }
    closing = '멋진 하루 되세요~';
    closingSpeech = '멋진 하루 되세요.';
  } else {
    if (!hasEvents) {
      wPart = `지금 비가 와요 ☔ 우산을 꼭 챙기세요! 기온은 ${tempNow}도, 강수확률은 ${rainProbNow}%예요.`;
      wSpeech = `지금 비가 와요. 우산을 꼭 챙기세요! 기온은 ${tempNow}도, 강수 확률은 ${rainProbNow} 퍼센트예요.`;
    }
    closing = '행복한 하루 되세요!';
    closingSpeech = '행복한 하루 되세요!';
  }

  let ePart = '', eSpeech = '';
  if (hasEvents) {
    // 장소+시간 일정: 그 장소의 그 시간 날씨로 메시지 구성
    const located = [];
    const otherTimed = [];
    const allDay = [];
    for (const ev of events) {
      if (!ev.start.dateTime) { allDay.push(ev); continue; }
      if (ev._weather) located.push(ev);
      else otherTimed.push(ev);
    }

    const locatedDisplay = [], locatedSpeech = [];
    for (const ev of located) {
      const dt = new Date(ev.start.dateTime);
      const hh = dt.getHours(), mm = dt.getMinutes();
      const tstr = mm === 0 ? `${hh}시` : `${hh}시 ${String(mm).padStart(2,'0')}분`;
      const place = ev._weather.placeName || ev.location;
      const code = ev._weather.code;
      const rp = ev._weather.rainProb || 0;
      let desc, descSpeech, tip, tipSpeech;
      if (THUNDER_CODES.has(code)) {
        desc = '천둥번개가 쳐요 ⛈️'; descSpeech = '천둥번개가 쳐요.';
        tip = '외출이 위험할 수 있어요. 조심하세요!'; tipSpeech = '외출이 위험할 수 있어요. 조심하세요.';
      } else if (SNOW_CODES.has(code)) {
        desc = '눈이 와요 ❄️'; descSpeech = '눈이 와요.';
        tip = '따뜻하게 입고 가세요!'; tipSpeech = '따뜻하게 입고 가세요.';
      } else if (RAIN_CODES.has(code) || rp >= 70) {
        desc = '비가 와요 ☔'; descSpeech = '비가 와요.';
        tip = '우산을 꼭 챙기세요!'; tipSpeech = '우산을 꼭 챙기세요.';
      } else if (rp >= 40) {
        desc = '흐려요 ☁️'; descSpeech = '흐려요.';
        tip = '우산 챙겨가면 좋아요.'; tipSpeech = '우산 챙겨가면 좋아요.';
      } else {
        desc = '날씨가 좋아요 ☀️'; descSpeech = '날씨가 좋아요.';
        tip = '잘 다녀오세요!'; tipSpeech = '잘 다녀오세요.';
      }
      // 일별 최저/최고(그 위치의 그 날짜) + 그 시각 강수확률
      const lo = ev._weather.lo != null ? Math.round(ev._weather.lo) : null;
      const hi = ev._weather.hi != null ? Math.round(ev._weather.hi) : null;
      let stat, statSpeech;
      if (lo != null && hi != null) {
        stat = `(최저 ${lo}° · 최고 ${hi}° · 강수확률 ${rp}%)`;
        statSpeech = `최저 기온은 ${lo}도, 최고 기온은 ${hi}도이고, 강수 확률은 ${rp} 퍼센트예요.`;
      } else {
        stat = `(강수확률 ${rp}%)`;
        statSpeech = `강수 확률은 ${rp} 퍼센트예요.`;
      }
      const intro = ev._weather.isCurrentLocation
        ? `${tstr}에 일정이 있으시군요.`
        : `${tstr}에 ${place}에서 일정이 있으시군요.`;
      locatedDisplay.push(`${intro} ${desc} ${stat} ${tip}`);
      locatedSpeech.push(`${intro} ${descSpeech} ${statSpeech} ${tipSpeech}`);
    }

    const otherSegs = [], otherSegsSpeech = [];
    if (otherTimed.length) {
      const list = otherTimed.map(e => {
        const dt = new Date(e.start.dateTime);
        const hh = dt.getHours(), mm = dt.getMinutes();
        const tstr = mm === 0 ? `${hh}시` : `${hh}시 ${String(mm).padStart(2,'0')}분`;
        return { tstr, name: e.summary || '(제목 없음)' };
      });
      if (list.length === 1) {
        otherSegs.push(`${list[0].tstr}에 '${list[0].name}' 일정`);
        otherSegsSpeech.push(`${list[0].tstr}에 ${list[0].name} 일정`);
      } else {
        const joined = list.map(x => `${x.tstr} ${x.name}`).join(', ');
        otherSegs.push(joined + ' 일정');
        otherSegsSpeech.push(joined + ' 일정');
      }
    }
    if (allDay.length) {
      const names = allDay.map(e => e.summary || '(제목 없음)').join(', ');
      otherSegs.push(`종일 '${names}'`);
      otherSegsSpeech.push(`종일 ${names}`);
    }

    const parts = [];
    const partsSpeech = [];
    if (locatedDisplay.length) {
      parts.push(locatedDisplay.join(' '));
      partsSpeech.push(locatedSpeech.join(' '));
    }
    if (otherSegs.length) {
      parts.push(`그리고 오늘 ${otherSegs.join(', ')}이 있네요. 잘 다녀오세요! 🙌`);
      partsSpeech.push(`그리고 오늘 ${otherSegsSpeech.join(', ')}이 있네요. 잘 다녀오세요.`);
    }
    ePart = parts.length ? ' ' + parts.join(' ') : '';
    eSpeech = partsSpeech.length ? ' ' + partsSpeech.join(' ') : '';
  }

  return { display: wPart + ePart + ' ' + closing, speech: wSpeech + eSpeech + ' ' + closingSpeech };
}

function rebuildSummary() {
  if (!summaryContext) return;
  const { tempNow, rainProbNow } = summaryContext;
  const { display, speech } = buildSummary(tempNow, rainProbNow, todayEventsCache);
  currentSummary = speech;
  const el = document.getElementById('summary-text');
  if (el) el.textContent = display;
}

// ===== 음성 재생 (TTS) =====
let currentSummary = '';
const SPEECH_RATE = 1.0;
let cachedKoVoice = null;

function loadVoicesOnce() {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) { resolve([]); return; }
    let v = speechSynthesis.getVoices();
    if (v.length) { resolve(v); return; }
    const handler = () => {
      v = speechSynthesis.getVoices();
      speechSynthesis.removeEventListener('voiceschanged', handler);
      resolve(v);
    };
    speechSynthesis.addEventListener('voiceschanged', handler);
    // 안전망: 일부 브라우저는 voiceschanged 이벤트를 안 보냄
    setTimeout(() => resolve(speechSynthesis.getVoices()), 1000);
  });
}

async function pickKoreanVoice() {
  if (cachedKoVoice) return cachedKoVoice;
  const voices = await loadVoicesOnce();
  if (!voices.length) return null;
  // 선호 보이스 우선 (iOS Yuna, Windows Heami, Google Korean 등)
  const prefer = ['Yuna', 'Heami', 'Sora', 'Google 한국의', 'Google 한국', 'Microsoft Heami'];
  for (const name of prefer) {
    const v = voices.find(x => x.name && x.name.includes(name));
    if (v) { cachedKoVoice = v; return v; }
  }
  const ko = voices.find(v => /^ko/i.test(v.lang || ''));
  cachedKoVoice = ko || null;
  return cachedKoVoice;
}

async function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert('이 브라우저는 음성 합성을 지원하지 않습니다.');
    return;
  }
  speechSynthesis.cancel();
  const btn = document.getElementById('speak-btn');
  if (btn) btn.classList.add('playing');

  // 긴 텍스트는 문장 단위로 쪼개기 (Chrome 200자 침묵 버그 회피)
  const chunks = (text.match(/[^.!?\n]+[.!?\n]?/g) || [text])
    .map(s => s.trim()).filter(Boolean);
  const voice = await pickKoreanVoice();

  let i = 0;
  const next = () => {
    if (i >= chunks.length) { if (btn) btn.classList.remove('playing'); return; }
    const u = new SpeechSynthesisUtterance(chunks[i]);
    u.lang = 'ko-KR';
    u.rate = SPEECH_RATE; u.pitch = 1.0; u.volume = 1.0;
    if (voice) u.voice = voice;
    u.onend = () => { i++; next(); };
    u.onerror = () => { if (btn) btn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  };
  next();
}

function speakSummary() {
  if (currentSummary) speak(currentSummary);
}

// 일정 장소별 날씨 캐시 (장소|날짜 → {placeName, code, rainProb, temp})
const eventWeatherCache = new Map();

async function geocodeEventLocation(loc) {
  // 1) Open-Meteo 지오코딩
  try {
    const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(loc)}&count=1&language=ko`).then(x => x.json());
    if (g.results && g.results.length) {
      return { lat: g.results[0].latitude, lon: g.results[0].longitude, name: g.results[0].name };
    }
  } catch (e) {}
  // 2) Nominatim 폴백 (한국 동/지명에 강함)
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(loc)}&format=json&limit=1&accept-language=ko`).then(x => x.json());
    if (r && r.length) {
      const a = r[0];
      const nameParts = (a.display_name || '').split(',').map(s => s.trim());
      return { lat: parseFloat(a.lat), lon: parseFloat(a.lon), name: nameParts[0] || loc };
    }
  } catch (e) {}
  return null;
}

async function getEventWeather(location, eventTime) {
  if (!location) return null;
  const dateKey = eventTime.toISOString().slice(0, 10);
  const cacheKey = `${location}|${dateKey}`;
  if (eventWeatherCache.has(cacheKey)) return eventWeatherCache.get(cacheKey);
  const geo = await geocodeEventLocation(location);
  if (!geo) { eventWeatherCache.set(cacheKey, null); return null; }
  try {
    const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,weather_code,precipitation&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3`).then(x => x.json());
    if (!w.hourly || !w.hourly.time) { eventWeatherCache.set(cacheKey, null); return null; }
    // Open-Meteo는 timezone=auto일 때 시각을 그 위치의 로컬타임 문자열(오프셋 X)로 줌.
    // 브라우저 로컬타임으로 파싱하면 위치 ≠ 브라우저 타임존일 때 어긋남.
    // utc_offset_seconds로 정확한 UTC ms 환산.
    const tzOffsetMs = (w.utc_offset_seconds || 0) * 1000;
    const toUtcMs = (localStr) => new Date(localStr + 'Z').getTime() - tzOffsetMs;
    const target = eventTime.getTime();
    let bestIdx = 0, bestDiff = Infinity;
    for (let i = 0; i < w.hourly.time.length; i++) {
      const diff = Math.abs(toUtcMs(w.hourly.time[i]) - target);
      if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
    }
    // 이벤트 날짜에 맞는 일별 최저/최고 — 그 위치 로컬 날짜 기준
    let lo = null, hi = null;
    if (w.daily && w.daily.time) {
      // eventTime을 그 위치의 로컬 날짜로 환산
      const localEventMs = eventTime.getTime() + tzOffsetMs;
      const le = new Date(localEventMs);
      const yyyy = le.getUTCFullYear(), mm = le.getUTCMonth(), dd = le.getUTCDate();
      for (let i = 0; i < w.daily.time.length; i++) {
        // daily.time도 로컬 날짜 문자열
        const ds = w.daily.time[i]; // "YYYY-MM-DD"
        const [y, m, d] = ds.split('-').map(Number);
        if (y === yyyy && (m - 1) === mm && d === dd) {
          lo = w.daily.temperature_2m_min[i];
          hi = w.daily.temperature_2m_max[i];
          break;
        }
      }
    }
    // 기본: 그 시각 예측값
    let code = w.hourly.weather_code[bestIdx];
    let temp = w.hourly.temperature_2m[bestIdx];
    let rainProb = w.hourly.precipitation_probability[bestIdx] || 0;
    // 이벤트가 현재 시각 근처(±30분)면 실제 관측값으로 보정
    // — 예보 확률은 0%인데 실제론 비 오는 경우 방지
    const isNow = Math.abs(eventTime.getTime() - Date.now()) < 30 * 60 * 1000;
    if (isNow && w.current) {
      code = w.current.weather_code;
      temp = w.current.temperature_2m;
      const curCode = w.current.weather_code;
      if (w.current.precipitation > 0 || RAIN_CODES.has(curCode) || THUNDER_CODES.has(curCode) || SNOW_CODES.has(curCode)) {
        rainProb = Math.max(rainProb, 80);
      }
    }
    const result = { placeName: geo.name, code, temp, rainProb, lo, hi };
    eventWeatherCache.set(cacheKey, result);
    return result;
  } catch (e) {
    eventWeatherCache.set(cacheKey, null);
    return null;
  }
}

function lookupCurrentForecastAt(eventTime) {
  if (!currentForecast || !currentForecast.hourly) return null;
  const h = currentForecast.hourly;
  const tzOffsetMs = (currentForecast.utc_offset_seconds || 0) * 1000;
  const toUtcMs = (localStr) => new Date(localStr + 'Z').getTime() - tzOffsetMs;
  const target = eventTime.getTime();
  let bestIdx = 0, bestDiff = Infinity;
  for (let i = 0; i < h.time.length; i++) {
    const diff = Math.abs(toUtcMs(h.time[i]) - target);
    if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
  }
  // 이벤트 날짜에 맞는 일별 최저/최고
  let lo = null, hi = null;
  if (currentForecast.daily && currentForecast.daily.time) {
    const localEventMs = eventTime.getTime() + tzOffsetMs;
    const le = new Date(localEventMs);
    const yyyy = le.getUTCFullYear(), mm = le.getUTCMonth(), dd = le.getUTCDate();
    const dArr = currentForecast.daily;
    for (let i = 0; i < dArr.time.length; i++) {
      const ds = dArr.time[i];
      const [y, m, d] = ds.split('-').map(Number);
      if (y === yyyy && (m - 1) === mm && d === dd) {
        lo = dArr.temperature_2m_min[i];
        hi = dArr.temperature_2m_max[i];
        break;
      }
    }
  }
  let code = h.weather_code[bestIdx];
  let temp = h.temperature_2m[bestIdx];
  let rainProb = h.precipitation_probability[bestIdx] || 0;
  // 현재 시각 근처면 실제 관측값으로 보정
  const isNow = Math.abs(eventTime.getTime() - Date.now()) < 30 * 60 * 1000;
  if (isNow && currentForecast.current) {
    const cur = currentForecast.current;
    code = cur.weather_code;
    temp = cur.temperature_2m;
    if (cur.precipitation > 0 || RAIN_CODES.has(cur.weather_code) || THUNDER_CODES.has(cur.weather_code) || SNOW_CODES.has(cur.weather_code)) {
      rainProb = Math.max(rainProb, 80);
    }
  }
  return {
    placeName: currentPlaceName || '현재 위치',
    code, temp, rainProb, lo, hi,
    isCurrentLocation: true,
  };
}

async function enrichEventsWithWeather(events) {
  await Promise.all(events.map(async ev => {
    if (!ev.start.dateTime) return;
    const t = new Date(ev.start.dateTime);
    if (ev.location) {
      // 일정에 장소가 있으면 그 장소의 날씨만 사용. 실패해도 현재 위치 폴백 금지.
      ev._weather = await getEventWeather(ev.location, t);
    } else {
      // 장소가 비어 있을 때만 현재 위치 예보 사용
      ev._weather = lookupCurrentForecastAt(t);
    }
  }));
}

let googleToken = null;
function googleAuth() {
  if (GOOGLE_CLIENT_ID.startsWith('YOUR_CLIENT_ID')) {
    document.getElementById('cal-result').innerHTML = '<div class="error">먼저 GOOGLE_CLIENT_ID 설정 필요</div>'; return;
  }
  if (!window.google || !google.accounts) {
    document.getElementById('cal-result').innerHTML = '<div class="error">Google 라이브러리 로드 실패</div>'; return;
  }
  const tc = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/calendar.readonly',
    callback: r => { if (r.access_token) { googleToken = r.access_token; loadEvents(); } }
  });
  tc.requestAccessToken({ prompt: 'select_account' });
}

function switchGoogleAccount() {
  const reauth = () => {
    googleToken = null;
    todayEventsCache = [];
    rebuildSummary();
    const btn = document.getElementById('switch-acc-btn');
    if (btn) btn.style.display = 'none';
    googleAuth();
  };
  if (googleToken && window.google && google.accounts.oauth2 && google.accounts.oauth2.revoke) {

async function loadEvents() {
  const el = document.getElementById('cal-result');
  el.innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7).toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(start)}&timeMax=${encodeURIComponent(end)}&singleEvents=true&orderBy=startTime&maxResults=20`;
    const data = await fetch(url, { headers: { Authorization: `Bearer ${googleToken}` } }).then(x => x.json());

    // 오늘 일정만 골라서 요약 멘트에 반영
    const today = new Date();
    const yyyy = today.getFullYear(), mm = today.getMonth(), dd = today.getDate();
    const todayStr = `${yyyy}-${String(mm+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    todayEventsCache = (data.items || []).filter(ev => {
      if (ev.start.dateTime) {
        const t = new Date(ev.start.dateTime);
        return t.getFullYear() === yyyy && t.getMonth() === mm && t.getDate() === dd;
      }
      return ev.start.date === todayStr;
    });

    const switchBtn = document.getElementById('switch-acc-btn');
    if (switchBtn) switchBtn.style.display = 'inline-block';

    renderTodayEvents();
    rebuildSummary();
    // 일정 장소별 날씨 비동기 enrich 후 멘트/리스트 재구성
    enrichEventsWithWeather(todayEventsCache).then(() => {
      renderTodayEvents();
      rebuildSummary();
    });
  } catch { el.innerHTML = '<div class="error">일정 가져오기 실패</div>'; }
}

function renderTodayEvents() {
  const el = document.getElementById('cal-result');
  if (!el) return;
  const countEl = document.getElementById('ev-count');
  if (!googleToken) {
    el.innerHTML = '<button class="cal-btn" onclick="googleAuth()">구글 캘린더 연결</button>';
    if (countEl) countEl.style.display = 'none';
    return;
  }

  const events = todayEventsCache || [];
  if (countEl) {
    countEl.style.display = events.length ? 'inline-block' : 'none';
    countEl.textContent = `${events.length}개`;
  }
  if (!events.length) {
    el.innerHTML = '<div class="events-empty">오늘 일정이 없어요</div>';
    return;
  }

  // 시작 시각 순 정렬
  const sorted = [...events].sort((a, b) => {
    const ta = a.start.dateTime ? new Date(a.start.dateTime).getTime() : 0;
    const tb = b.start.dateTime ? new Date(b.start.dateTime).getTime() : 0;
    return ta - tb;
  });

  const now = Date.now();
  let html = '';
  for (const ev of sorted) {
    let timeStr, isUpcoming = false;
    if (ev.start.dateTime) {
      const dt = new Date(ev.start.dateTime);
      timeStr = `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      const start = dt.getTime();
      const end = (ev.end && ev.end.dateTime) ? new Date(ev.end.dateTime).getTime() : start + 60*60*1000;
      isUpcoming = now >= (start - 30*60*1000) && now <= end;
    } else {
      timeStr = '종일';
    }

    const name = ev.summary || '(제목 없음)';
    const place = ev.location || '';
    let weatherText = '', probClass = 'clear', emoji = '';
    let rp = null;
    if (ev._weather) {
      rp = ev._weather.rainProb || 0;
      const code = ev._weather.code;
      const w = wmo(code);
      emoji = w[0];
      if (THUNDER_CODES.has(code)) { weatherText = '천둥번개'; probClass = 'thunder'; }
      else if (SNOW_CODES.has(code)) { weatherText = '눈'; probClass = 'snowy'; }
      else if (RAIN_CODES.has(code) || rp >= 70) {
        weatherText = rp >= 85 ? '강한 비' : (rp >= 50 ? '비' : '약한 비');
        probClass = 'rainy';
      } else if (rp >= 40) {
        weatherText = '흐림'; probClass = 'cloudy';
      } else {
        weatherText = '맑음'; probClass = 'clear';
      }
    }

    const subBits = [];
    if (place) subBits.push(place);
    if (weatherText) subBits.push(weatherText);
    const subText = subBits.join(' · ') || '&nbsp;';

    const probHtml = (rp != null)
      ? `<div class="ev-prob ${probClass}">${emoji} ${rp}%</div>`
      : `<div class="ev-prob" style="opacity:0.5">...</div>`;

    html += `<div class="ev-item ${isUpcoming ? 'upcoming' : ''}">
      <div class="ev-time">${timeStr}</div>
      <div class="ev-info">
        <div class="name">${escapeHtml(name)}</div>
        <div class="sub">${subText}</div>
      </div>
      ${probHtml}
    </div>`;
  }
  el.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== 아두이노 (HC-05) Web Serial 연동 =====
let arduinoPort = null;
let arduinoWriter = null;
let arduinoReader = null;
let arduinoConnected = false;
let arduinoSendTimer = null;

function updateArduinoUI() {
  const stateEl = document.getElementById('arduino-state');
  const resultEl = document.getElementById('arduino-result');
  if (!stateEl || !resultEl) return;
  if (arduinoConnected) {
    stateEl.textContent = '🟢 연결됨';
    const rainy = isRainExpectedToday();
    resultEl.innerHTML = `
      <div style="padding:6px 0;font-size:14px">현재 송신값: <b>RAIN=${rainy ? 1 : 0}</b> ${rainy ? '☔' : '☀️'}</div>
      <div style="display:flex;gap:8px">
        <button class="cal-btn" style="flex:1" onclick="sendRainStateToArduino(true)">📡 지금 다시 전송</button>
        <button class="cal-btn" style="flex:1;background:rgba(255,150,150,0.25)" onclick="disconnectArduino()">연결 해제</button>
      </div>
    `;
  } else {
    stateEl.textContent = '미연결';
    resultEl.innerHTML = `
      <button class="cal-btn" onclick="connectArduino()">🔗 아두이노 연결 (HC-05)</button>
      <div style="font-size:11px;opacity:0.65;margin-top:8px;line-height:1.5">
        ※ PC Chrome/Edge에서 HC-05를 윈도우와 페어링한 후 클릭<br>
        ※ 폰 브라우저는 HC-05(Classic BT) 직접 연결 불가
      </div>
    `;
  }
}

function isRainExpectedToday() {
  // 30분 윈도우 안 일정이 하나라도 있으면 → 그 일정들로만 판단 (현재 위치는 무시)
  if (todayEventsCache && todayEventsCache.length) {
    const now = Date.now();
    const WINDOW = 30 * 60 * 1000;
    const inWindow = todayEventsCache.filter(ev => {
      if (!ev._weather) return false;
      if (!ev.start.dateTime) return true; // 종일 일정
      const start = new Date(ev.start.dateTime).getTime();
      const end = (ev.end && ev.end.dateTime) ? new Date(ev.end.dateTime).getTime() : start + 60 * 60 * 1000;
      return now >= (start - WINDOW) && now <= end;
    });
    if (inWindow.length) {
      for (const ev of inWindow) {
        const rp = ev._weather.rainProb || 0;
        const code = ev._weather.code;
        if (RAIN_CODES.has(code) || THUNDER_CODES.has(code) || rp >= 70) return true;
      }
      return false; // 일정 있는데 그 일정들 다 비 안 옴 → RAIN=0 (현재 위치 폴백 안 함)
    }
  }
  // 30분 윈도우 안 일정 없을 때만 → 현재 위치 · 현재 시각 강수확률 폴백
  if (currentRainProb >= 70) return true;
  return false;
}

async function openArduinoPort(port) {
  await port.open({ baudRate: 9600 });
  arduinoPort = port;
  arduinoWriter = port.writable.getWriter();
  arduinoConnected = true;
  updateArduinoUI();
  readArduinoLoop(port);
  await sendRainStateToArduino();
  if (arduinoSendTimer) clearInterval(arduinoSendTimer);
  arduinoSendTimer = setInterval(sendRainStateToArduino, 5 * 60 * 1000);
}

async function connectArduino() {
  if (!('serial' in navigator)) {
    alert('이 브라우저는 Web Serial을 지원하지 않습니다.\nPC Chrome 또는 Edge를 사용해주세요.');
    return;
  }
  try {
    const port = await navigator.serial.requestPort();
    await openArduinoPort(port);
  } catch (e) {
    console.error('아두이노 연결 실패:', e);
    if (e && e.name !== 'NotFoundError') {
      alert('아두이노 연결 실패: ' + (e.message || e));
    }
  }
}

// 이전에 허가받은 포트가 있으면 페이지 로드 시 자동 연결
async function autoConnectArduino() {
  if (!('serial' in navigator)) return;
  try {
    const ports = await navigator.serial.getPorts();
    if (!ports.length) return; // 권한받은 포트 없음 → 사용자가 직접 연결해야
    // 여러 개면 첫 번째 사용 (HC-05가 보통 하나)
    for (const port of ports) {
      try {
        await openArduinoPort(port);
        console.log('[아두이노] 자동 재연결 성공');
        return;
      } catch (e) {
        console.warn('[아두이노] 이 포트 열기 실패, 다음 시도:', e.message || e);
      }
    }
  } catch (e) {
    console.warn('[아두이노] 자동 연결 실패:', e);
  }
}

// 외부에서 USB/BT 케이블 분리되면 상태 갱신
if ('serial' in navigator) {
  navigator.serial.addEventListener('disconnect', e => {
    if (e.target === arduinoPort) {
      console.log('[아두이노] 포트 분리 감지');
      arduinoConnected = false;
      arduinoPort = null;
      arduinoWriter = null;
      updateArduinoUI();
    }
  });
  navigator.serial.addEventListener('connect', e => {
    // 같은 포트가 다시 잡히면 재연결 시도
    if (!arduinoConnected) {
      console.log('[아두이노] 포트 재발견, 재연결 시도');
      openArduinoPort(e.target).catch(() => {});
    }
  });
}

async function disconnectArduino() {
  if (arduinoSendTimer) { clearInterval(arduinoSendTimer); arduinoSendTimer = null; }
  try { if (arduinoWriter) await arduinoWriter.close(); } catch (e) {}
  try { if (arduinoReader) await arduinoReader.cancel(); } catch (e) {}
  try { if (arduinoPort) await arduinoPort.close(); } catch (e) {}
  arduinoWriter = null; arduinoReader = null; arduinoPort = null;
  arduinoConnected = false;
  updateArduinoUI();
}

async function readArduinoLoop(port) {
  if (!port || !port.readable) return;
  const decoder = new TextDecoder();
  let buf = '';
  try {
    const reader = port.readable.getReader();
    arduinoReader = reader;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line) continue;
        console.log('[아두이노]', line);
        // 외출 감지 → 멘트 자동 재생 (우산 작동 여부와 무관)
        if (line === 'FACE') {
          if (currentSummary) speak(currentSummary);
        }
      }
    }
  } catch (e) {
    console.warn('아두이노 읽기 종료:', e);
    arduinoConnected = false;
    updateArduinoUI();
  }
}

async function sendRainStateToArduino(forceShow) {
  if (!arduinoConnected || !arduinoWriter) return;
  const rainy = isRainExpectedToday();
  const line = `RAIN:${rainy ? 1 : 0}\n`;
  try {
    await arduinoWriter.write(new TextEncoder().encode(line));
    console.log('[전송→아두이노]', line.trim());
    if (forceShow) updateArduinoUI();
  } catch (e) {
    console.error('전송 실패:', e);
    arduinoConnected = false;
    updateArduinoUI();
  }
}

// 날씨/일정 갱신 후마다 아두이노에도 자동 반영
const _origRebuild = rebuildSummary;
rebuildSummary = function() {
  _origRebuild.apply(this, arguments);
  if (arduinoConnected) sendRainStateToArduino();
  updateArduinoUI();
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

// 마지막 위치 캐시 (localStorage)
const LAST_LOC_KEY = 'weather-app-last-location';
function saveLastLocation(lat, lon, name) {
  try {
    localStorage.setItem(LAST_LOC_KEY, JSON.stringify({ lat, lon, name, t: Date.now() }));
  } catch (e) {}
}
function getLastLocation() {
  try {
    const v = localStorage.getItem(LAST_LOC_KEY);
    if (!v) return null;
    return JSON.parse(v);
  } catch (e) { return null; }
}

function autoLocate() {
  // 1) 캐시가 있으면 즉시 표시 — 사용자가 바로 결과를 봄
  const cached = getLastLocation();
  if (cached && cached.lat && cached.lon) {
    loadByCoords(cached.lat, cached.lon, cached.name);
  }
  // 2) 백그라운드에서 새 위치 요청 — 성공 시 갱신
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        // 캐시 좌표와 거의 같으면 굳이 다시 안 그림
        if (cached && Math.abs(cached.lat - latitude) < 0.005 && Math.abs(cached.lon - longitude) < 0.005) return;
        loadByCoords(latitude, longitude, null);
      },
      err => {
        // 캐시 폴백 — 캐시도 없으면 마지막 수단으로 서울
        if (!cached) {
          console.warn('GPS 실패, 서울로 폴백:', err && err.message);
          load('서울');
        }
      },
      { timeout: 15000, enableHighAccuracy: true, maximumAge: 60000 }
    );
  } else if (!cached) {
    load('서울');
  }
}

// loadByCoords 성공 시 캐시 갱신을 위한 후킹
const _origLoadByCoords = loadByCoords;
loadByCoords = async function(lat, lon, placeName) {
  const r = await _origLoadByCoords(lat, lon, placeName);
  // currentPlaceName이 갱신된 후 저장
  if (currentPlaceName) saveLastLocation(lat, lon, currentPlaceName);
  return r;
};

window.addEventListener('load', () => {
  autoLocate();
  // 위치/날씨 잡힌 다음 잠깐 뒤에 시도 (RAIN 보낼 데이터 준비된 후)
  setTimeout(autoConnectArduino, 2000);
});
</script>
